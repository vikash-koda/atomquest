spring:
  application:
    name: atomquest-goal-tracking-portal

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/atomquest?sslmode=require}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:springstudent}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:atomquest-hackathon-secret-key-that-is-long-enough-for-hs256}
    expiration-ms: 86400000

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://*.vercel.app}